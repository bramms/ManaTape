name: Перевірки
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make install test check
      - name: OpenCode Free — offline
        working-directory: integrations/opencode-free
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/extension.test.mjs
